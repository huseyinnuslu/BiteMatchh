name: 🎭 Canlı Etkinlik Sync

on:
  schedule:
    - cron: '0 3 * * *'   # Her gece 03:00 UTC (Türkiye 06:00)
  workflow_dispatch:       # Manuel tetikleme

concurrency:
  group: bite-match-live-event-sync
  cancel-in-progress: false

jobs:
  fetch-events:
    name: 📡 Etkinlik Verisi Çek & Kaydet
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v6

      - name: 🟢 Node.js Kurulumu
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Bağımlılıkları Yükle
        run: npm ci
        working-directory: backend

      - name: 🎭 Etkinlik Sync
        env:
          MONGO_URI:        ${{ secrets.MONGO_URI }}
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
          NODE_ENV:         production
        run: node scripts/fetchLiveEvents.js
        working-directory: backend

      - name: 📋 Özet
        if: always()
        run: |
          echo "## 🎭 BiteMatch Etkinlik Sync" >> $GITHUB_STEP_SUMMARY
          echo "| Alan | Değer |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Tarih (UTC) | $(date -u '+%Y-%m-%d %H:%M') |" >> $GITHUB_STEP_SUMMARY
          echo "| Tetikleyici | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Durum | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY

  notify-on-failure:
    name: 🚨 Hata Bildirimi
    runs-on: ubuntu-latest
    needs: fetch-events
    if: failure()
    steps:
      - name: 🚨 Hata Logu
        run: echo "❌ BiteMatch etkinlik sync başarısız! Logları kontrol et."
