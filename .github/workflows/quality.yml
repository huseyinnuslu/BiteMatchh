name: BiteMatch Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4
      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Backend bağımlılıkları
        run: npm ci
        working-directory: backend
      - name: Backend regresyon testleri
        run: npm test
        working-directory: backend
      - name: Frontend bağımlılıkları
        run: npm ci
        working-directory: frontend
      - name: Frontend production build
        run: npm run build
        working-directory: frontend
